name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Type check
        run: mypy tor

      # 01.1 is normative: an import may only point downward, and the rules subsystems
      # must stay independent of one another.
      - name: Architecture contracts
        run: lint-imports

      - name: Tests
        run: pytest --cov=tor --cov-branch --cov-report=term-missing

      # 19: tor.rolls, tor.effects and tor.rules are where the rules live, so all three
      # are held to full branch coverage.
      - name: Coverage gate on the core
        run: |
          coverage report --include='tor/rolls.py' --fail-under=100
          coverage report --include='tor/effects/*' --fail-under=100
          coverage report --include='tor/rules/*' --fail-under=100
